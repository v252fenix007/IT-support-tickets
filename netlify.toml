[build]
  command = "npm --prefix client install && npm --prefix client run build && npm --prefix server install"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

# Proxy API calls to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page App routing fallback to React index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
